name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Build and run the test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The core, the tools and the tests need nothing but a C11 compiler.
      # SDL2 is here only because the default target also builds the graphical
      # frontend, which the Linux build links against it.
      - name: Install SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      # make test builds everything, cross-verifies the monitor ROM by
      # reassembling rom/monitor.asm and requiring byte-for-byte equality with
      # rom/monitor.bin, then runs the 8080 suite, the display ghosting test,
      # acceptance criteria 2 and 4, and the headless CLI smoke script.
      - name: make test
        run: make test
